version: '3.8'

services:
  web:
    image: python:3.9-slim
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data   # Managed named volume
    networks:
      - app-net

volumes:
  redis_data:

networks:
  app-net:
